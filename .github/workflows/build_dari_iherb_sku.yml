name: Build Dari iHerb SKU dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_dari_iherb_sku.py'
      - '.github/workflows/build_dari_iherb_sku.yml'

permissions:
  contents: write

concurrency:
  group: build-dari-iherb-sku
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build 10,000 SKU rows
        env:
          SCRAPE_WORKERS: '8'
        run: python tools/build_dari_iherb_sku.py
      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dari_sku_2000_20260901.csv data/dari_sku_2000_20260901_status.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data: build Dari iHerb SKU rows [skip ci]'
            git push
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dari-iherb-sku-20260901
          path: |
            data/dari_sku_2000_20260901.csv
            data/dari_sku_2000_20260901_status.json
          if-no-files-found: error
          retention-days: 3
